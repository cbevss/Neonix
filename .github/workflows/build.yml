name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Neonix/Neonix.csproj

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/Neonix/Neonix.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\Neonix.exe -DestinationPath Neonix-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Neonix-win-x64
          path: Neonix-win-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Neonix-win-x64.zip
          generate_release_notes: true
