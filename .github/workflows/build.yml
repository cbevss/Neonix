name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Neonix/Neonix.csproj

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/Neonix/Neonix.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      # Bundle the OpenRGB driver so users don't have to download it themselves.
      # Best effort: if it can't be fetched, the installer is still built without it.
      - name: Fetch OpenRGB
        id: openrgb
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $urls = @()

          # 1) Newest experimental pipeline build from the OpenRGB project (needed for recent hardware).
          $urls += 'https://gitlab.com/CalcProgrammer1/OpenRGB/-/jobs/artifacts/master/download?job=Windows%2064'

          # 2) Latest tagged release assets, if the project lists any.
          try {
            $releases = Invoke-RestMethod 'https://gitlab.com/api/v4/projects/CalcProgrammer1%2FOpenRGB/releases'
            foreach ($r in $releases) {
              foreach ($l in $r.assets.links) {
                Write-Host "Release asset: $($r.tag_name) / $($l.name) / $($l.url)"
                if ($l.url -match 'Windows' -and $l.url -match '64' -and $l.url -match '\.zip') { $urls += $l.url }
              }
            }
          } catch { Write-Host "Release API: $($_.Exception.Message)" }

          # 3) Links on the OpenRGB website.
          try {
            $page = Invoke-WebRequest 'https://openrgb.org/releases.html'
            foreach ($m in [regex]::Matches($page.Content, 'href="([^"]*Windows_64[^"]*\.zip)"')) {
              $u = $m.Groups[1].Value
              if ($u -notmatch '^http') { $u = 'https://openrgb.org/' + $u.TrimStart('/') }
              Write-Host "Website asset: $u"
              $urls += $u
            }
          } catch { Write-Host "Website: $($_.Exception.Message)" }

          foreach ($url in $urls) {
            Write-Host "Trying $url"
            try {
              Remove-Item openrgb.zip, openrgb-tmp -Recurse -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest $url -OutFile openrgb.zip
              Expand-Archive openrgb.zip -DestinationPath openrgb-tmp -Force
              $exe = Get-ChildItem openrgb-tmp -Recurse -Filter OpenRGB.exe | Select-Object -First 1
              if (-not $exe) { Write-Host 'No OpenRGB.exe in that archive.'; continue }
              New-Item -ItemType Directory -Force openrgb | Out-Null
              Copy-Item "$($exe.Directory.FullName)\*" openrgb -Recurse -Force
              Write-Host "Bundled OpenRGB from $url"
              exit 0
            } catch { Write-Host "Failed: $($_.Exception.Message)" }
          }
          throw 'Could not fetch OpenRGB from any source.'

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.1.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\Neonix.iss
          Get-ChildItem installer-out

      # Installs the installer on the runner and starts the installed app, to catch
      # problems that only show up after installing (permissions, missing files, crashes).
      - name: Smoke test (install and launch)
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer-out\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait
          $dir = Join-Path $env:ProgramFiles 'Neonix'
          $exe = Join-Path $dir 'Neonix.exe'
          Write-Host "Installed exe exists: $(Test-Path $exe)"
          Get-ChildItem $dir | Format-Table Name, Length
          Write-Host "OpenRGB folder present: $(Test-Path (Join-Path $dir 'OpenRGB\OpenRGB.exe'))"
          try {
            $p = Start-Process $exe -PassThru
            Start-Sleep -Seconds 12
            if ($p.HasExited) { Write-Host "SMOKE: app exited early with code $($p.ExitCode)" }
            else { Write-Host 'SMOKE: app started and kept running'; Stop-Process $p -Force }
          } catch { Write-Host "SMOKE: could not start app: $($_.Exception.Message)" }
          Get-Process OpenRGB -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\Neonix.exe -DestinationPath Neonix-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Neonix-installer
          path: |
            installer-out/*.exe
            Neonix-portable-win-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-out/*.exe
            Neonix-portable-win-x64.zip
          generate_release_notes: true
