name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Neonix/Neonix.csproj

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/Neonix/Neonix.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      # Bundle the OpenRGB driver so users don't have to download it themselves.
      # Best effort: if it can't be fetched, the installer is still built without it.
      - name: Fetch OpenRGB
        id: openrgb
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = Invoke-RestMethod 'https://gitlab.com/api/v4/projects/CalcProgrammer1%2FOpenRGB/releases'
          $url = $null
          foreach ($r in $releases) {
            foreach ($l in $r.assets.links) {
              if ($l.name -match 'Windows' -and $l.name -match '64' -and ($l.url -match '\.zip$' -or $l.direct_asset_url -match '\.zip$')) {
                $url = if ($l.direct_asset_url) { $l.direct_asset_url } else { $l.url }
                Write-Host "Release: $($r.tag_name)  Asset: $($l.name)"
                break
              }
            }
            if ($url) { break }
          }
          if (-not $url) { throw 'No Windows 64-bit OpenRGB zip found in the GitLab releases.' }
          Write-Host "Downloading $url"
          Invoke-WebRequest $url -OutFile openrgb.zip
          Expand-Archive openrgb.zip -DestinationPath openrgb-tmp
          $exe = Get-ChildItem openrgb-tmp -Recurse -Filter OpenRGB.exe | Select-Object -First 1
          if (-not $exe) { throw 'OpenRGB.exe not found in the archive.' }
          New-Item -ItemType Directory -Force openrgb | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" openrgb -Recurse -Force
          Write-Host "Bundled OpenRGB from $($exe.Directory.FullName)"

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.1.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\Neonix.iss
          Get-ChildItem installer-out

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\Neonix.exe -DestinationPath Neonix-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Neonix-installer
          path: |
            installer-out/*.exe
            Neonix-portable-win-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-out/*.exe
            Neonix-portable-win-x64.zip
          generate_release_notes: true
